name: Triage community review submission
on:
  issues:
    types: [opened]
permissions:
  contents: read
  issues: write
jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body
            if (typeof body !== 'string' || body.length > 100000) return
            const matches = [...body.matchAll(/<!-- REVIEW_PUBLIC_SUBMISSION_V1\s*\n([\s\S]*?)\nREVIEW_PUBLIC_SUBMISSION_END -->/g)]
            if (matches.length !== 1 || matches[0][1].length > 10000) return
            try { const value = JSON.parse(matches[0][1]); if (!value || typeof value !== 'object' || Array.isArray(value)) return } catch { return }
            const labels = [
              { name: 'review-submission', color: 'e65f32', description: 'Public community review awaiting moderation' },
              { name: 'approved-review', color: '2f7d62', description: 'Approved by GatheredApp for publication' }
            ]
            for (const label of labels) { try { await github.rest.issues.getLabel({...context.repo,name:label.name}) } catch(error) { if(error.status!==404) throw error; await github.rest.issues.createLabel({...context.repo,...label}) } }
            await github.rest.issues.addLabels({...context.repo,issue_number:context.issue.number,labels:['review-submission']})
            const acknowledgement = 'Thanks for sharing your review. It is awaiting moderation before it appears on the site.'
            const comments = await github.paginate(github.rest.issues.listComments,{...context.repo,issue_number:context.issue.number})
            if(!comments.some(c=>c.user?.login==='github-actions[bot]'&&c.body===acknowledgement)) await github.rest.issues.createComment({...context.repo,issue_number:context.issue.number,body:acknowledgement})
