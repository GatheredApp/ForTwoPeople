name: Add Facebook review from owner issue
on:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
concurrency:
  group: repository-data-ingestion
  cancel-in-progress: false
jobs:
  ingest:
    if: >-
      github.event.issue.user.login == 'GatheredApp' &&
      github.event.issue.author_association == 'OWNER' &&
      contains(github.event.issue.body, '<!-- FACEBOOK_REVIEW_SUBMISSION_V1')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Authorize, validate, and append event snapshot
        id: ingestion
        continue-on-error: true
        run: node scripts/add-facebook-review-from-issue.mjs
      - name: Comment with validation error
        if: steps.ingestion.outcome == 'failure'
        uses: actions/github-script@v7
        env:
          ERROR: ${{ steps.ingestion.outputs.error }}
        with:
          script: |
            const detail = process.env.ERROR || 'The submission could not be validated.'
            await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body: `❌ Could not add this Facebook review: ${detail}` })
      - if: steps.ingestion.outcome == 'failure'
        run: exit 1
      - if: steps.ingestion.outputs.duplicate != 'true'
        run: npm run validate:data
      - if: steps.ingestion.outputs.duplicate != 'true'
        run: npm test
      - if: steps.ingestion.outputs.duplicate != 'true'
        run: npm run lint
      - if: steps.ingestion.outputs.duplicate != 'true'
        run: npm run build
      - name: Commit and push
        id: commit
        if: steps.ingestion.outputs.duplicate != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/facebookReviews.json
          git commit -m "Add Facebook review from issue #${{ github.event.issue.number }}"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
      - name: Comment and close
        uses: actions/github-script@v7
        env:
          DUPLICATE: ${{ steps.ingestion.outputs.duplicate }}
        with:
          script: |
            const body = process.env.DUPLICATE === 'true' ? 'This Facebook post is already present.' : '✅ Added this Facebook Group Review. The site will redeploy automatically.'
            await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body })
            await github.rest.issues.update({ ...context.repo, issue_number: context.issue.number, state: 'closed' })
      - name: Explain a failed check or push
        if: failure() && steps.ingestion.outcome != 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body: '❌ The review passed validation, but a repository check or push failed. The issue remains open.' })
